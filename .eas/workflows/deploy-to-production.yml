name: Deploy to production

on:
  push:
    branches: ["main"]

env:
  EXPO_DEBUG: "1"

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit new iOS build
    needs: [build_ios]
    if: ${{ needs.build_ios.outputs.build_id }}
    type: submit
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  publish_ios_preview_update:
    name: Publish iOS preview update
    needs: [build_ios]
    if: ${{ needs.build_ios.outputs.build_id }}
    type: update
    params:
      branch: preview
      platform: ios
